name: Windows quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Check formatting
        shell: pwsh
        run: if ((gofmt -l .).Length -ne 0) { exit 1 }
      - name: Run tests
        run: go test -race -shuffle=on -timeout=5m ./...
      - name: Run vet
        run: go vet ./...
