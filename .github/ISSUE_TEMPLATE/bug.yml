name: Bug report
description: Report a reproducible LocalMesh problem
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, topology, logs, and versions. Remove secrets.
    validations:
      required: true

